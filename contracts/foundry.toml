[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"
cbor_metadata = false

# The compiler pin and evm_version are provisional until G02 records which
# compilation path the live chain accepts. Do not change them for a product
# reason before that gate has a verdict.

[fuzz]
runs = 1000
